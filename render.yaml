services:
  - type: web
    name: unifyos-platform
    env: node
    buildCommand: >-
      npm ci && npm run build &&
      mkdir -p apps/frontend/.next/standalone/apps/frontend/.next &&
      cp -R apps/frontend/.next/static apps/frontend/.next/standalone/apps/frontend/.next/static &&
      if [ -d apps/frontend/public ]; then cp -R apps/frontend/public apps/frontend/.next/standalone/apps/frontend/public; fi
    preDeployCommand: npm run prisma:migrate
    startCommand: node apps/frontend/.next/standalone/apps/frontend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
